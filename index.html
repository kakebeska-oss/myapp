<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Byrat Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg-1: #0a0a14;
    --bg-2: #12121f;
    --accent: #7c5cff;
    --accent-2: #00d4ff;
    --gold: #ffd700;
    --green: #00e676;
    --red: #ff4757;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-1);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Анимированный градиентный фон */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 15% 20%, rgba(124, 92, 255, 0.25), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0, 212, 255, 0.18), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255, 100, 200, 0.08), transparent 60%);
    animation: bgMove 20s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes bgMove {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.15) rotate(3deg); }
  }

  /* Сетка поверх фона */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
  }

  /* Летающие значки */
  .particle {
    position: fixed;
    font-size: 20px;
    font-weight: 900;
    color: rgba(255, 215, 0, 0.5);
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-110vh) translateX(30px) rotate(360deg); opacity: 0; }
  }

  /* Экраны */
  .screen {
    display: none;
    padding: 24px 20px 100px;
    min-height: 100vh;
    position: relative;
    z-index: 2;
    flex-direction: column;
  }
  .screen.active {
    display: flex;
    animation: screenFade 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes screenFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Заголовки */
  .header {
    text-align: center;
    margin-bottom: 32px;
    margin-top: 8px;
  }
  .header h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 32px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 0%, #a8a8ff 50%, #7c5cff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header p {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Кнопки */
  .btn {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 18px 24px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin: 6px 0;
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
  }
  .btn:hover::before { left: 100%; }
  .btn:active { transform: scale(0.97); }
  
  .btn-icon {
    font-size: 22px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(124, 92, 255, 0.15);
    border-radius: 12px;
    flex-shrink: 0;
  }
  .btn-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .btn-title { font-weight: 700; font-size: 16px; }
  .btn-sub { font-size: 12px; color: var(--text-dim); font-weight: 500; }

  /* Главная кнопка СТАРТ */
  .btn-hero {
    background: linear-gradient(135deg, #7c5cff 0%, #5b3fd9 100%);
    border: none;
    box-shadow: 
      0 20px 50px rgba(124, 92, 255, 0.5),
      0 0 0 1px rgba(255,255,255,0.1) inset;
    justify-content: center;
    text-align: center;
    font-size: 20px;
    padding: 24px;
    margin: 40px 0;
    animation: heroPulse 3s ease-in-out infinite;
  }
  .btn-hero .btn-text { align-items: center; }
  @keyframes heroPulse {
    0%, 100% { box-shadow: 0 20px 50px rgba(124, 92, 255, 0.5), 0 0 0 1px rgba(255,255,255,0.1) inset; }
    50% { box-shadow: 0 20px 70px rgba(124, 92, 255, 0.8), 0 0 0 1px rgba(255,255,255,0.2) inset; }
  }

  /* Баланс */
  .balance-card {
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(255, 215, 0, 0.03));
    border: 1px solid rgba(255, 215, 0, 0.25);
    border-radius: 24px;
    padding: 36px 24px;
    text-align: center;
    margin: 20px 0;
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
  }
  .balance-card::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255, 215, 0, 0.15), transparent 70%);
    animation: shine 4s linear infinite;
  }
  @keyframes shine {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .balance-label {
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .balance-num {
    font-family: 'Montserrat', sans-serif;
    font-size: 64px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
    line-height: 1;
    position: relative;
  }
  .balance-star {
    font-size: 22px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Магазин */
  .item {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 18px;
    margin: 10px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.25s;
    animation: itemIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .item:nth-child(2) { animation-delay: 0.05s; }
  .item:nth-child(3) { animation-delay: 0.1s; }
  .item:nth-child(4) { animation-delay: 0.15s; }
  @keyframes itemIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .item:hover { border-color: rgba(124, 92, 255, 0.4); }
  
  .item-flag {
    font-size: 36px;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    flex-shrink: 0;
  }
  .item-info {
    flex: 1;
    padding: 0 14px;
  }
  .item-name {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 3px;
  }
  .item-price {
    font-size: 14px;
    color: var(--gold);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  
  .btn-buy {
    background: linear-gradient(135deg, var(--green), #00b85a);
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 12px;
    color: #fff;
    box-shadow: 0 6px 20px rgba(0, 230, 118, 0.35);
    width: auto;
    margin: 0;
    justify-content: center;
  }

  /* Пополнение */
  .topup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
  }
  .topup-btn {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 24px 12px;
    border-radius: 18px;
    font-size: 20px;
    font-weight: 800;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    animation: itemIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .topup-btn:nth-child(1) { animation-delay: 0.02s; }
  .topup-btn:nth-child(2) { animation-delay: 0.06s; }
  .topup-btn:nth-child(3) { animation-delay: 0.10s; }
  .topup-btn:nth-child(4) { animation-delay: 0.14s; }
  .topup-btn:nth-child(5) { animation-delay: 0.18s; }
  .topup-btn:nth-child(6) { animation-delay: 0.22s; }
  .topup-btn:active { transform: scale(0.95); }
  .topup-btn:hover { border-color: rgba(124, 92, 255, 0.5); background: rgba(124, 92, 255, 0.1); }
  .topup-amount { font-size: 22px; font-weight: 900; }
  .topup-star { font-size: 14px; color: var(--gold); }

  /* Промокод */
  .promo-input {
    width: 100%;
    padding: 20px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    border-radius: 18px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: white;
    text-align: center;
    outline: none;
    margin: 20px 0;
    text-transform: uppercase;
    letter-spacing: 4px;
    transition: all 0.2s;
  }
  .promo-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.2);
  }
  .promo-input::placeholder {
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
  }

  /* Помощь */
  .help-card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    margin: 16px 0;
  }
  .help-link {
    display: inline-block;
    color: var(--accent-2);
    font-weight: 700;
    font-size: 18px;
    text-decoration: none;
    padding: 12px 24px;
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 14px;
    margin-top: 12px;
    transition: all 0.2s;
  }
  .help-link:active { transform: scale(0.96); }

  /* Нижняя навигация */
  .nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(18, 18, 31, 0.85);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 10px;
    display: flex;
    gap: 6px;
    z-index: 100;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    max-width: calc(100% - 32px);
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 60px;
  }
  .nav-btn .nav-icon { font-size: 20px; }
  .nav-btn.active {
    color: var(--text);
    background: rgba(124, 92, 255, 0.2);
  }
  .nav-btn:active { transform: scale(0.92); }

  /* Тост */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-140px);
    background: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 16px 24px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 15px;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    z-index: 1000;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    white-space: pre-line;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast.success { border-color: rgba(0, 230, 118, 0.5); box-shadow: 0 20px 60px rgba(0,230,118,0.3); }
  .toast.error { border-color: rgba(255, 71, 87, 0.5); box-shadow: 0 20px 60px rgba(255,71,87,0.3); }

  /* Утилиты */
  .spacer { height: 20px; }
  .back-btn {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    padding: 12px 20px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    margin: 20px auto 0;
    display: block;
    width: fit-content;
    transition: all 0.2s;
  }
  .back-btn:active { transform: scale(0.96); }
</style>
</head>
<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="screen-main" class="screen active">
  <div class="header">
    <h1>Byrat Shop</h1>
    <p>Premium Accounts</p>
  </div>
  <button class="btn btn-hero" onclick="showScreen('screen-menu')">
    <div class="btn-text">
      <span class="btn-title">НАЧАТЬ</span>
      <span class="btn-sub" style="color: rgba(255,255,255,0.7);">открыть магазин</span>
    </div>
  </button>
</div>

<!-- МЕНЮ -->
<div id="screen-menu" class="screen">
  <div class="header">
    <h1>Меню</h1>
    <p>Выбери действие</p>
  </div>

  <button class="btn" onclick="showScreen('screen-shop')">
    <div class="btn-icon">🛒</div>
    <div class="btn-text">
      <span class="btn-title">Магазин</span>
      <span class="btn-sub">Купить аккаунт</span>
    </div>
  </button>

  <button class="btn" onclick="showScreen('screen-topup')">
    <div class="btn-icon">➕</div>
    <div class="btn-text">
      <span class="btn-title">Пополнить</span>
      <span class="btn-sub">За звёзды или промокод</span>
    </div>

  <button class="btn" onclick="showScreen('screen-balance')">

      <span class="btn-title">Баланс</span>
      <span class="btn-sub">Проверить счёт</span>
    </div>
  </button>

  <button class="btn" onclick="showScreen('screen-promo')">

      <span class="btn-sub">Активировать код</span>

  <button class="btn" onclick="showScreen('screen-help')">
    <div class="btn-icon">❓</div>
    <div class="btn-text">

      <span class="btn-sub">Связаться с поддержкой</span>

  </button>
</div>

<!-- БАЛАНС -->
<div id="screen-balance" class="screen">
  <div class="header">
    <h1>Баланс</h1>
    <p>Твой счёт</p>
  </div>

  <div class="balance-card">
    <div class="balance-label">Доступно</div>
    <div class="balance-num" id="balance-display">0<span class="balance-star">⭐</span></div>
  </div>

  <button class="btn" onclick="showScreen('screen-topup')" style="justify-content: center;">
    <div class="btn-text" style="align-items: center;">
      <span class="btn-title">➕ Пополнить баланс</span>
    </div>
  </button>
</div>

<!-- ПОПОЛНЕНИЕ -->

  </div>

  <div class="topup-grid">
    <button class="topup-btn" onclick="payStars(10)">
      <span class="topup-amount">10</span>

    <button class="topup-btn" onclick="payStars(20)">
      <span class="topup-amount">20</span>
      <span class="topup-star">⭐</span>
    </button>
    <button class="topup-btn" onclick="payStars(50)">
      <span class="topup-amount">50</span>
      <span class="topup-star">⭐</span>
    </button>
    <button class="topup-btn" onclick="payStars(100)">
      <span class="topup-amount">100</span>
      <span class="topup-star">⭐</span>
    </button>
    <button class="topup-btn" onclick="payStars(150)">
      <span class="topup-amount">150</span>
      <span class="topup-star">⭐</span>
    </button>
    <button class="topup-btn" onclick="payStars(300)">
      <span class="topup-amount">300</span>
      <span class="topup-star">⭐</span>
    </button>
  </div>

  <button class="btn" onclick="showScreen('screen-promo')" style="justify-content: center; background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05)); border-color: rgba(255,215,0,0.3);">
    <div class="btn-text" style="align-items: center;">
      <span class="btn-title">🎁 Пополнить промокодом</span>
    </div>
  </button>
</div>

<!-- ПРОМОКОД -->
<div id="screen-promo" class="screen">
  <div class="header">
    <h1>Промокод</h1>
    <p>Введи код</p>
  </div>

  <input type="text" id="promo-input" class="promo-input" placeholder="КОД" maxlength="20">

  <button class="btn" onclick="activatePromo()" style="justify-content: center; background: linear-gradient(135deg, #7c5cff, #5b3fd9); border: none; box-shadow: 0 10px 30px rgba(124,92,255,0.4);">

      <span class="btn-title">✅ Активировать</span>

<!-- МАГАЗИН -->
<div id="screen-shop" class="screen">

    <h1>Магазин</h1>

  <div class="item">
    <div class="item-flag">🇺🇸</div>

      <div class="item-name">Канада +1</div>
      <div class="item-price">100 ⭐</div>
    </div>
    <button class="btn btn-buy" onclick="buy('canada')">Купить</button>

  <div class="item">
    <div class="item-flag">🇲🇲</div>
    <div class="item-info">
      <div class="item-name">Мьянма +95</div>
      <div class="item-price">120 ⭐</div>
    </div>
    <button class="btn btn-buy" onclick="buy('myanmar')">Купить</button>
  </div>
</div>

<!-- ПОМОЩЬ -->
<div id="screen-help" class="screen">
  <div class="header">
    <h1>Помощь</h1>
    <p>Связаться с нами</p>
  </div>

  <div class="help-card">
    <div style="font-size: 48px; margin-bottom: 12px;">💬</div>
    <div style="font-size: 15px; color: var(--text-dim); margin-bottom: 8px;">По всем вопросам пишите</div>
    <a href="https://t.me/ownerByrat_Shop" target="_blank" class="help-link">@ownerByrat_Shop</a>
  </div>
</div>

<!-- НИЖНЯЯ НАВИГАЦИЯ -->
<div class="nav" id="nav">
  <button class="nav-btn" data-screen="screen-menu" onclick="showScreen('screen-menu')">
    <span class="nav-icon">🏠</span>
    <span>Главная</span>
  </button>
  <button class="nav-btn" data-screen="screen-shop" onclick="showScreen('screen-shop')">
    <span class="nav-icon">🛒</span>
    <span>Магазин</span>
  </button>
  <button class="nav-btn" data-screen="screen-balance" onclick="showScreen('screen-balance'); loadBalance();">
    <span class="nav-icon">💰</span>
    <span>Баланс</span>
  </button>
  <button class="nav-btn" data-screen="screen-help" onclick="showScreen('screen-help')">
    <span class="nav-icon">❓</span>
    <span>Помощь</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  Telegram.WebApp.setHeaderColor('#0a0a14');
  Telegram.WebApp.setBackgroundColor('#0a0a14');

  const API_BASE = "https://my-telegram-bot.kakebeska.workers.dev";
  const urlParams = new URLSearchParams(window.location.search);
  const userId = urlParams.get('user_id')
    || (Telegram.WebApp.initDataUnsafe.user ? Telegram.WebApp.initDataUnsafe.user.id : null);

  // Летающие значки
  const symbols = ["$", "⭐", "💎", "$", "⭐"];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + 'vh';
    p.style.fontSize = (12 + Math.random() * 16) + 'px';
    const dur = 12 + Math.random() * 12;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = '-' + (Math.random() * dur) + 's';
    p.style.opacity = 0.3 + Math.random() * 0.4;
    document.body.appendChild(p);
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    
    // Обновляем активную кнопку в навигации
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.screen === id);
    });
    
    // Скрываем навигацию на главном экране
    const nav = document.getElementById('nav');
    if (id === 'screen-main') {
      nav.style.display = 'none';
    } else {
      nav.style.display = 'flex';
    }
    
    // Обновляем баланс при переходе
    if (id === 'screen-balance') loadBalance();
  }

  function showToast(text, type = '') {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast ' + type, 3500);
  }

  async function loadBalance() {
    const display = document.getElementById('balance-display');
    display.innerHTML = '...<span class="balance-star">⭐</span>';
    try {
      const res = await fetch(`${API_BASE}/api/balance?user_id=${userId}`);
      const data = await res.json();
      display.innerHTML = `${data.balance}<span class="balance-star">⭐</span>`;
    } catch (e) {
      display.innerHTML = '0<span class="balance-star">⭐</span>';
    }
  }

  async function activatePromo() {
    const input = document.getElementById('promo-input');
    const code = input.value.trim();
    if (!code) {
      showToast('Введи промокод', 'error');
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/promo?user_id=${userId}&code=${encodeURIComponent(code)}`);
      const data = await res.json();
      showToast(data.message, data.ok ? 'success' : 'error');
      if (data.ok) input.value = '';
    } catch (e) {
      showToast('Ошибка соединения', 'error');
    }
  }

  async function payStars(amount) {
    Telegram.WebApp.sendData("pay_" + amount);
    Telegram.WebApp.close();
  }

  async function buy(country) {
    try {
      const res = await fetch(`${API_BASE}/api/buy?user_id=${userId}&country=${country}`);
      const data = await res.json();
      if (data.ok) {
        showToast('Загляни в чат с ботом 👀', 'success');
      } else {
        showToast(data.message, 'error');
      }
    } catch (e) {
      showToast('Ошибка соединения', 'error');
    }
  }

  // Инициализация
  showScreen('screen-main');
</script>
</body>
</html>
