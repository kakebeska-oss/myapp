<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Byrat Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Noto Color Emoji Flags';
    src: url('https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/fonts/NotoColorEmoji.ttf') format('truetype');
    unicode-range: U+1F1E6-1F1FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #05050f;
    --accent: #8b5cf6;
    --accent-hot: #d946ef;
    --accent-cyan: #22d3ee;
    --gold: #fbbf24;
    --green: #10b981;
    --red: #ef4444;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.55);
  }

  html, body { width: 100%; overflow-x: hidden; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    position: relative;
  }

  /* Статичный яркий фон */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.45), transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(217, 70, 239, 0.35), transparent 40%),
      radial-gradient(circle at 50% 80%, rgba(34, 211, 238, 0.3), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(251, 191, 36, 0.2), transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(139, 92, 246, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139, 92, 246, 0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
  }

  .particle {
    position: fixed;
    font-weight: 900;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
    will-change: transform;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.85; }
    100% { transform: translateY(-110vh) translateX(30px); opacity: 0; }
  }

  .screen {
    display: none;
    padding: 24px 20px 110px;
    min-height: 100vh;
    position: relative;
    z-index: 2;
    flex-direction: column;
  }
  .screen.active {
    display: flex;
    animation: screenIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header { text-align: center; margin-bottom: 28px; margin-top: 12px; }
  .header h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 36px;
    letter-spacing: -1px;
    line-height: 1;
    background: linear-gradient(135deg, #ffffff 0%, #d946ef 40%, #8b5cf6 70%, #22d3ee 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 8s ease infinite;
    filter: drop-shadow(0 0 25px rgba(217, 70, 239, 0.5));
    margin-bottom: 8px;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .header p {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .btn {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 16px 20px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin: 7px 0;
  }
  .btn:active { transform: scale(0.97); }

  .btn-icon {
    font-size: 22px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(217, 70, 239, 0.2));
    border: 1px solid rgba(139, 92, 246, 0.4);
    border-radius: 14px;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
  }
  .btn-text { display: flex; flex-direction: column; gap: 2px; }
  .btn-title { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
  .btn-sub { font-size: 11px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.5px; }

  /* HERO без вращения */
  .btn-hero {
    background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 50%, #8b5cf6 100%);
    background-size: 200% 200%;
    border: none;
    box-shadow: 0 25px 60px rgba(139, 92, 246, 0.6), 0 0 0 1px rgba(255,255,255,0.15) inset;
    justify-content: center;
    text-align: center;
    padding: 28px;
    margin: 50px 0;
    animation: gradientShift 5s ease infinite, heroGlow 3s ease-in-out infinite;
  }
  @keyframes heroGlow {
    0%, 100% { box-shadow: 0 25px 60px rgba(139, 92, 246, 0.6), 0 0 0 1px rgba(255,255,255,0.15) inset; }
    50% { box-shadow: 0 25px 80px rgba(217, 70, 239, 0.8), 0 0 0 1px rgba(255,255,255,0.25) inset; }
  }
  .btn-hero .btn-text { align-items: center; }
  .btn-hero .btn-title { font-size: 22px; letter-spacing: 2px; }

  .balance-card {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.18), rgba(251, 191, 36, 0.03));
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 28px;
    padding: 40px 24px;
    text-align: center;
    margin: 24px 0;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(251, 191, 36, 0.25), 0 0 0 1px rgba(255,255,255,0.05) inset;
  }
  .balance-label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 16px;
    font-weight: 700;
  }
  .balance-num {
    font-family: 'Montserrat', sans-serif;
    font-size: 68px;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 0%, #fbbf24 50%, #fff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
    line-height: 1;
    filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.8));
  }
  .balance-star { font-size: 24px; margin-left: 6px; }

  .item {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 16px;
    margin: 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    animation: itemIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .item:hover { border-color: rgba(139, 92, 246, 0.5); transform: translateY(-2px); box-shadow: 0 15px 40px rgba(139, 92, 246, 0.25); }
  .item:nth-child(2) { animation-delay: 0.06s; }
  .item:nth-child(3) { animation-delay: 0.12s; }
  .item:nth-child(4) { animation-delay: 0.18s; }
  @keyframes itemIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Флаг через спец-шрифт + fallback на SVG */
  .flag {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    font-size: 34px;
    font-family: 'Noto Color Emoji Flags', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
  }
  .flag svg { width: 100%; height: 100%; display: block; }

  .item-info { flex: 1; padding: 0 14px; }
  .item-name { font-weight: 800; font-size: 17px; margin-bottom: 4px; letter-spacing: -0.3px; }
  .item-price {
    font-size: 14px;
    color: var(--gold);
    font-weight: 800;
    text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
  }
  .btn-buy {
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 800;
    border-radius: 14px;
    color: #fff;
    box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
    width: auto;
    margin: 0;
    justify-content: center;
    letter-spacing: 0.5px;
  }

  .topup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin: 24px 0;
  }
  .topup-btn {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 26px 12px;
    border-radius: 22px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: itemIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .topup-btn:hover { border-color: rgba(139, 92, 246, 0.6); transform: translateY(-3px); box-shadow: 0 20px 50px rgba(139, 92, 246, 0.35); }
  .topup-btn:active { transform: scale(0.95); }
  .topup-btn:nth-child(1) { animation-delay: 0.02s; }
  .topup-btn:nth-child(2) { animation-delay: 0.06s; }
  .topup-btn:nth-child(3) { animation-delay: 0.10s; }
  .topup-btn:nth-child(4) { animation-delay: 0.14s; }
  .topup-btn:nth-child(5) { animation-delay: 0.18s; }
  .topup-btn:nth-child(6) { animation-delay: 0.22s; }
  .topup-amount {
    font-size: 28px;
    font-weight: 900;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #fff, #d946ef);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .topup-star { font-size: 16px; }

  .promo-input {
    width: 100%;
    padding: 22px;
    font-size: 20px;
    font-weight: 800;
    font-family: 'Montserrat', sans-serif;
    border-radius: 20px;
    border: 2px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: white;
    text-align: center;
    outline: none;
    margin: 24px 0;
    text-transform: uppercase;
    letter-spacing: 6px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .promo-input:focus {
    border-color: var(--accent-hot);
    box-shadow: 0 0 0 6px rgba(217, 70, 239, 0.2), 0 0 40px rgba(217, 70, 239, 0.4);
  }
  .promo-input::placeholder { color: rgba(255,255,255,0.25); letter-spacing: 4px; }

  .help-card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    margin: 20px 0;
    animation: itemIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .help-link {
    display: inline-block;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    text-decoration: none;
    padding: 16px 32px;
    background: linear-gradient(135deg, #22d3ee, #0891b2);
    border-radius: 16px;
    margin-top: 16px;
    box-shadow: 0 10px 30px rgba(34, 211, 238, 0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
    transition: transform 0.2s;
  }
  .help-link:active { transform: scale(0.95); }

  .nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 10, 25, 0.85);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    padding: 10px;
    display: flex;
    gap: 4px;
    z-index: 100;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(139, 92, 246, 0.2);
    max-width: calc(100% - 32px);
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 62px;
    letter-spacing: 0.3px;
  }
  .nav-btn .nav-icon { font-size: 22px; transition: transform 0.2s; }
  .nav-btn.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(217, 70, 239, 0.3));
    box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
  }
  .nav-btn.active .nav-icon { transform: scale(1.15); }
  .nav-btn:active { transform: scale(0.92); }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-160px);
    background: rgba(10, 10, 25, 0.95);
    backdrop-filter: blur(24px);
    border: 2px solid var(--glass-border);
    padding: 18px 28px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 15px;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
    opacity: 0;
    z-index: 1000;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    white-space: pre-line;
    box-shadow: 0 25px 80px rgba(0,0,0,0.7);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(16, 185, 129, 0.8); box-shadow: 0 25px 80px rgba(16, 185, 129, 0.5); }
  .toast.error { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 25px 80px rgba(239, 68, 68, 0.5); }
</style>
</head>
<body>

<div id="screen-main" class="screen active">
  <div class="header">
    <h1>Byrat Shop</h1>
    <p>✦ Premium Accounts ✦</p>
  </div>
  <button class="btn btn-hero" onclick="showScreen('screen-menu')">
    <div class="btn-text">
      <span class="btn-title">НАЧАТЬ</span>
      <span class="btn-sub" style="color: rgba(255,255,255,0.9); font-size: 12px; letter-spacing: 2px;">ОТКРЫТЬ МАГАЗИН</span>
    </div>
  </button>
</div>

<div id="screen-menu" class="screen">
  <div class="header"><h1>Меню</h1><p>Выбери действие</p></div>

  <button class="btn" onclick="showScreen('screen-shop')">
    <div class="btn-icon">🛒</div>
    <div class="btn-text"><span class="btn-title">Магазин</span><span class="btn-sub">Купить аккаунт</span></div>
  </button>

  <button class="btn" onclick="showScreen('screen-topup')">
    <div class="btn-icon">➕</div>
    <div class="btn-text"><span class="btn-title">Пополнить</span><span class="btn-sub">Звёзды или промокод</span></div>
  </button>

  <button class="btn" onclick="showScreen('screen-balance')">
    <div class="btn-icon">💰</div>
    <div class="btn-text"><span class="btn-title">Баланс</span><span class="btn-sub">Проверить счёт</span></div>
  </button>

  <button class="btn" onclick="showScreen('screen-promo')">
    <div class="btn-icon">🎁</div>
    <div class="btn-text"><span class="btn-title">Промокод</span><span class="btn-sub">Активировать код</span></div>
  </button>

  <button class="btn" onclick="showScreen('screen-help')">
    <div class="btn-icon">❓</div>
    <div class="btn-text"><span class="btn-title">Помощь</span><span class="btn-sub">Связаться с нами</span></div>
  </button>
</div>

<div id="screen-balance" class="screen">
  <div class="header"><h1>Баланс</h1><p>Твой счёт</p></div>

  <div class="balance-card">
    <div class="balance-label">Доступно</div>
    <div class="balance-num" id="balance-display">0<span class="balance-star">⭐</span></div>
  </div>

  <button class="btn" onclick="showScreen('screen-topup')" style="justify-content: center; background: linear-gradient(135deg, rgba(139,92,246,0.4), rgba(217,70,239,0.3)); border-color: rgba(139,92,246,0.6);">
    <div class="btn-text" style="align-items: center;"><span class="btn-title">➕ Пополнить баланс</span></div>
  </button>
</div>

<div id="screen-topup" class="screen">
  <div class="header"><h1>Пополнение</h1><p>Выбери сумму</p></div>

  <div class="topup-grid">
    <button class="topup-btn" onclick="payStars(10)"><span class="topup-amount">10</span><span class="topup-star">⭐</span></button>
    <button class="topup-btn" onclick="payStars(20)"><span class="topup-amount">20</span><span class="topup-star">⭐</span></button>
    <button class="topup-btn" onclick="payStars(50)"><span class="topup-amount">50</span><span class="topup-star">⭐</span></button>
    <button class="topup-btn" onclick="payStars(100)"><span class="topup-amount">100</span><span class="topup-star">⭐</span></button>
    <button class="topup-btn" onclick="payStars(150)"><span class="topup-amount">150</span><span class="topup-star">⭐</span></button>
    <button class="topup-btn" onclick="payStars(300)"><span class="topup-amount">300</span><span class="topup-star">⭐</span></button>
  </div>

  <button class="btn" onclick="showScreen('screen-promo')" style="justify-content: center; background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(251,191,36,0.08)); border-color: rgba(251,191,36,0.5); box-shadow: 0 10px 40px rgba(251,191,36,0.3);">
    <div class="btn-text" style="align-items: center;"><span class="btn-title">🎁 Пополнить промокодом</span></div>
  </button>
</div>

<div id="screen-promo" class="screen">
  <div class="header"><h1>Промокод</h1><p>Введи код</p></div>

  <input type="text" id="promo-input" class="promo-input" placeholder="КОД" maxlength="20">

  <button class="btn" onclick="activatePromo()" style="justify-content: center; background: linear-gradient(135deg, #8b5cf6, #d946ef); border: none; box-shadow: 0 15px 50px rgba(217,70,239,0.6), 0 0 0 1px rgba(255,255,255,0.1) inset;">
    <div class="btn-text" style="align-items: center;"><span class="btn-title">✅ АКТИВИРОВАТЬ</span></div>
  </button>
</div>

<div id="screen-shop" class="screen">
  <div class="header"><h1>Магазин</h1><p>Доступные аккаунты</p></div>

  <div class="item">
    <div class="flag">🇺🇸</div>
    <div class="item-info">
      <div class="item-name">США +1</div>
      <div class="item-price">100 ⭐</div>
    </div>
    <button class="btn btn-buy" onclick="buy('usa')">КУПИТЬ</button>
  </div>

  <div class="item">
    <div class="flag">🇨🇦</div>
    <div class="item-info">
      <div class="item-name">Канада +1</div>
      <div class="item-price">100 ⭐</div>
    </div>
    <button class="btn btn-buy" onclick="buy('canada')">КУПИТЬ</button>
  </div>

  <div class="item">
    <div class="flag">🇲🇲</div>
    <div class="item-info">
      <div class="item-name">Мьянма +95</div>
      <div class="item-price">120 ⭐</div>
    </div>
    <button class="btn btn-buy" onclick="buy('myanmar')">КУПИТЬ</button>
  </div>
</div>

<div id="screen-help" class="screen">
  <div class="header"><h1>Помощь</h1><p>Связаться с нами</p></div>

  <div class="help-card">
    <div style="font-size: 56px; margin-bottom: 16px;">💬</div>
    <div style="font-size: 15px; color: var(--text-dim); margin-bottom: 12px; font-weight: 600;">По всем вопросам пишите</div>
    <a href="https://t.me/ownerByrat_Shop" target="_blank" class="help-link">@ownerByrat_Shop</a>
  </div>
</div>

<div class="nav" id="nav">
  <button class="nav-btn" data-screen="screen-menu" onclick="showScreen('screen-menu')">
    <span class="nav-icon">🏠</span><span>Главная</span>
  </button>
  <button class="nav-btn" data-screen="screen-shop" onclick="showScreen('screen-shop')">
    <span class="nav-icon">🛒</span><span>Магазин</span>
  </button>
  <button class="nav-btn" data-screen="screen-balance" onclick="showScreen('screen-balance')">
    <span class="nav-icon">💰</span><span>Баланс</span>
  </button>
  <button class="nav-btn" data-screen="screen-help" onclick="showScreen('screen-help')">
    <span class="nav-icon">❓</span><span>Помощь</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  Telegram.WebApp.setHeaderColor('#05050f');
  Telegram.WebApp.setBackgroundColor('#05050f');

  const API_BASE = "https://my-telegram-bot.kakebeska.workers.dev";
  const urlParams = new URLSearchParams(window.location.search);
  const userId = urlParams.get('user_id')
    || (Telegram.WebApp.initDataUnsafe.user ? Telegram.WebApp.initDataUnsafe.user.id : null);

  // Меньше частиц = плавнее
  const symbols = [
    { char: "$", color: "#10b981" },
    { char: "⭐", color: "#fbbf24" },
    { char: "💎", color: "#22d3ee" },
    { char: "✦", color: "#d946ef" }
  ];
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    const s = symbols[Math.floor(Math.random() * symbols.length)];
    p.className = 'particle';
    p.textContent = s.char;
    p.style.color = s.color;
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + 'vh';
    p.style.fontSize = (12 + Math.random() * 16) + 'px';
    const dur = 12 + Math.random() * 14;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = '-' + (Math.random() * dur) + 's';
    p.style.opacity = 0.4 + Math.random() * 0.4;
    document.body.appendChild(p);
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.screen === id);
    });

    const nav = document.getElementById('nav');
    nav.style.display = (id === 'screen-main') ? 'none' : 'flex';

    if (id === 'screen-balance') loadBalance();
  }

  function showToast(text, type = '') {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast ' + type, 3500);
  }

  // Баланс через XMLHttpRequest (работает везде)
  function loadBalance() {
    const display = document.getElementById('balance-display');
    display.innerHTML = '...<span class="balance-star">⭐</span>';

    if (!userId) {
      display.innerHTML = '0<span class="balance-star">⭐</span>';
      return;
    }

    const xhr = new XMLHttpRequest();
    xhr.open('GET', `${API_BASE}/api/balance?user_id=${userId}`, true);
    xhr.timeout = 8000;

    xhr.onload = function () {
      try {
        const data = JSON.parse(xhr.responseText);
        display.innerHTML = `${data.balance}<span class="balance-star">⭐</span>`;
      } catch (e) {
        display.innerHTML = '0<span class="balance-star">⭐</span>';
      }
    };

    xhr.onerror = function () {
      display.innerHTML = '0<span class="balance-star">⭐</span>';
    };

    xhr.ontimeout = function () {
      display.innerHTML = '0<span class="balance-star">⭐</span>';
    };

    xhr.send();
  }

  function activatePromo() {
    const input = document.getElementById('promo-input');
    const code = input.value.trim();
    if (!code) { showToast('Введи промокод', 'error'); return; }

    const xhr = new XMLHttpRequest();
    xhr.open('GET', `${API_BASE}/api/promo?user_id=${userId}&code=${encodeURIComponent(code)}`, true);
    xhr.timeout = 8000;

    xhr.onload = function () {
      try {
        const data = JSON.parse(xhr.responseText);
        showToast(data.message, data.ok ? 'success' : 'error');
        if (data.ok) input.value = '';
      } catch (e) {
        showToast('Ошибка ответа', 'error');
      }
    };

    xhr.onerror = function () { showToast('Ошибка соединения', 'error'); };
    xhr.ontimeout = function () { showToast('Превышено время ожидания', 'error'); };
    xhr.send();
  }

  function payStars(amount) {
    Telegram.WebApp.sendData("pay_" + amount);
    Telegram.WebApp.close();
  }

  function buy(country) {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', `${API_BASE}/api/buy?user_id=${userId}&country=${country}`, true);
    xhr.timeout = 8000;

    xhr.onload = function () {
      try {
        const data = JSON.parse(xhr.responseText);
        if (data.ok) showToast('Загляни в чат с ботом 👀', 'success');
        else showToast(data.message, 'error');
      } catch (e) {
        showToast('Ошибка ответа', 'error');
      }
    };

    xhr.onerror = function () { showToast('Ошибка соединения', 'error'); };
    xhr.ontimeout = function () { showToast('Превышено время ожидания', 'error'); };
    xhr.send();
  }

  showScreen('screen-main');
</script>
</body>
</html>
