<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        h1 { font-size: 28px; }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🎰 Добро пожаловать!</h1>
    <p>Это моё мини-приложение внутри Telegram.</p>
    <button onclick="Telegram.WebApp.close()">Закрыть</button>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
