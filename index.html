<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byrat Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #1a0033, #0f0c29);
    background-size: 500% 500%;
    animation: gradientBG 18s ease infinite;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 30%, rgba(120,80,255,0.25), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(255,80,180,0.2), transparent 45%);
    animation: glowShift 12s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes glowShift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(20px, -20px) scale(1.15); }
  }
  .particle {
    position: fixed;
    font-size: 20px;
    font-weight: 900;
    color: rgba(255,215,0,0.75);
    text-shadow: 0 0 12px rgba(255,215,0,0.6);
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity: 0; }
    10% { opacity: 1; }
    50% { transform: translateY(-50vh) translateX(20px) rotate(180deg) scale(1.1); opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-100vh) translateX(-20px) rotate(360deg) scale(0.9); opacity: 0; }
  }
  .screen {
    padding: 30px 22px;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .screen.active { display: flex; animation: screenIn 0.45s ease; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 {
    font-weight: 900;
    font-size: 30px;
    text-align: center;
    margin-bottom: 22px;
    text-shadow: 0 0 22px rgba(140,140,255,0.85);
  }
  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 18px 26px;
    font-size: 19px;
    font-weight: 700;
    border-radius: 18px;
    margin: 9px 0;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(102,126,234,0.5);
    transition: transform 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-center {
    padding: 24px 70px;
    font-size: 26px;
    margin-top: 40px;
  }
  .btn-exit {
    position: fixed;
    bottom: 20px; left: 20px;
    background: rgba(255,60,60,0.85);
    padding: 13px 22px;
    font-size: 16px;
    z-index: 3;
  }
  .btn-back {
    background: rgba(255,255,255,0.15);
    margin-top: 20px;
    font-size: 16px;
  }
  .menu { margin-top: 20px; display: flex; flex-direction: column; }
  .item {
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 18px;
    margin: 11px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .item-left { display: flex; align-items: center; gap: 13px; font-weight: 700; font-size: 17px; }
  .flag { font-size: 30px; }
  .price { color: #ffd700; font-size: 15px; font-weight: 700; }
  .btn-buy {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    padding: 11px 20px;
    font-size: 15px;
    border-radius: 13px;
  }
  .topup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }
  .topup-btn {
    margin: 0;
    padding: 22px 10px;
    font-size: 20px;
  }
  a { color: #7ec8ff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<div id="screen-main" class="screen active">
  <h1>Byrat Shop</h1>
  <button class="btn btn-center" onclick="showScreen('screen-menu')">СТАРТ</button>
  <button class="btn btn-exit" onclick="Telegram.WebApp.close()">← Выйти</button>
</div>

<div id="screen-menu" class="screen">
  <h1>Меню</h1>
  <div class="menu">
    <button class="btn" onclick="showScreen('screen-shop')">🛒 Купить</button>
    <button class="btn" onclick="showScreen('screen-topup')">➕ Пополнить</button>
    <button class="btn" onclick="showScreen('screen-help')">❓ Помощь</button>
    <button class="btn btn-back" onclick="showScreen('screen-main')">← Назад</button>
  </div>
</div>

<div id="screen-topup" class="screen">
  <h1>➕ Пополнение</h1>
  <div class="topup-grid">
    <button class="btn topup-btn" onclick="payStars(10)">10 ⭐</button>
    <button class="btn topup-btn" onclick="payStars(20)">20 ⭐</button>
    <button class="btn topup-btn" onclick="payStars(50)">50 ⭐</button>
    <button class="btn topup-btn" onclick="payStars(100)">100 ⭐</button>
    <button class="btn topup-btn" onclick="payStars(150)">150 ⭐</button>
    <button class="btn topup-btn" onclick="payStars(300)">300 ⭐</button>
  </div>
  <button class="btn btn-back" onclick="showScreen('screen-menu')">← Назад</button>
</div>

<div id="screen-shop" class="screen">
  <h1>🛒 Доступные аккаунты:</h1>

  <div class="item">
    <div class="item-left">
      <span class="flag">🇺🇸</span>
      <div>США +1<br><span class="price">100 ⭐</span></div>
    </div>
    <button class="btn btn-buy" onclick="buy('usa')">Купить</button>
  </div>

  <div class="item">
    <div class="item-left">
      <span class="flag">🇨🇦</span>
      <div>Канада +1<br><span class="price">100 ⭐</span></div>
    </div>
    <button class="btn btn-buy" onclick="buy('canada')">Купить</button>
  </div>

  <div class="item">
    <div class="item-left">
      <span class="flag">🇲🇲</span>
      <div>Мьянма +95<br><span class="price">120 ⭐</span></div>
    </div>
    <button class="btn btn-buy" onclick="buy('myanmar')">Купить</button>
  </div>

  <button class="btn btn-back" onclick="showScreen('screen-menu')">← Назад</button>
</div>

<div id="screen-help" class="screen">
  <h1>❓ Помощь</h1>
  <p style="text-align:center; margin: 20px 0; font-size: 17px;">
    По всем вопросам пишите:
  </p>
  <p style="text-align:center; font-size: 21px;">
    <a href="https://t.me/ownerByrat_Shop" target="_blank">@ownerByrat_Shop</a>
  </p>
  <button class="btn btn-back" onclick="showScreen('screen-menu')">← Назад</button>
</div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  const symbols = ["$", "⭐", "$", "⭐", "$", "$", "⭐"];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + 'vh';
    p.style.fontSize = (14 + Math.random() * 18) + 'px';
    const dur = 8 + Math.random() * 10;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = '-' + (Math.random() * dur) + 's';
    p.style.opacity = 0.5 + Math.random() * 0.5;
    document.body.appendChild(p);
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function payStars(amount) {
    Telegram.WebApp.sendData("pay_" + amount);
    Telegram.WebApp.close();
  }

  function buy(country) {
    Telegram.WebApp.sendData("buy_" + country);
    Telegram.WebApp.close();
  }
</script>
</body>
</html>
