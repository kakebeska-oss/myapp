<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Byrat Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #080710;
    --bg-darker: #040409;
    --accent-1: #9d4edd;
    --accent-2: #ff007f;
    --accent-3: #00f5d4;
    --accent-blue: #00bbf9;
    --gold: #fee440;
    --glass: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-hover: rgba(255, 255, 255, 0.08);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
  }
  
  html, body { width: 100%; overflow-x: hidden; }
  body { 
    font-family: 'Inter', sans-serif; 
    background: var(--bg-darker); 
    color: var(--text); 
    min-height: 100vh; 
    position: relative; 
    overflow-y: auto;
  }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; animation: floatBlob 20s infinite ease-in-out alternate; }
  .blob-1 { width: 300px; height: 300px; background: var(--accent-1); top: -5%; left: -10%; animation-delay: 0s; }
  .blob-2 { width: 250px; height: 250px; background: var(--accent-2); bottom: 10%; right: -10%; animation-delay: -5s; }
  .blob-3 { width: 200px; height: 200px; background: var(--accent-3); top: 40%; left: 50%; transform: translateX(-50%); animation-delay: -10s; opacity: 0.4; }

  @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

  .particle { position: fixed; font-weight: 900; pointer-events: none; z-index: 1; animation: floatUp linear infinite; filter: drop-shadow(0 0 8px currentColor); }
  @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; } }

  .screen { display: none; padding: 30px 20px 120px; min-height: 100vh; position: relative; z-index: 2; flex-direction: column; }
  .screen.active { display: flex; animation: screenSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes screenSlideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
  .header h1 { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 38px; background: linear-gradient(135deg, #fff 0%, var(--accent-3) 50%, var(--accent-1) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; letter-spacing: -1px; }
  .header p { font-size: 12px; color: var(--text-dim); font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }

  .btn { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); padding: 18px 20px; font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; border-radius: 20px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; width: 100%; margin: 10px 0; backdrop-filter: blur(10px); transition: all 0.2s; }
  .btn:active { transform: scale(0.97); background: var(--glass-hover); }
  
  .btn-hero { background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%); border: none; box-shadow: 0 15px 40px rgba(157, 78, 221, 0.4), inset 0 1px 0 rgba(255,255,255,0.2); justify-content: center; text-align: center; padding: 30px; margin: 60px 0; position: relative; overflow: hidden; }
  .btn-hero::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
  .btn-hero:active::before { left: 100%; }
  .btn-hero .btn-title { font-size: 24px; letter-spacing: 2px; font-weight: 900; }
  .btn-hero .btn-sub { font-size: 12px; color: rgba(255,255,255,0.8); font-weight: 600; margin-top: 4px; }

  .categories { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; flex: 1; align-content: center; }
  .category { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 28px; padding: 30px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; cursor: pointer; text-align: center; min-height: 230px; backdrop-filter: blur(10px); transition: all 0.3s; }
  .category:active { transform: scale(0.95); background: var(--glass-hover); }
  .category.tg { border-color: rgba(0, 245, 212, 0.3); box-shadow: inset 0 0 40px rgba(0, 245, 212, 0.05); }
  .category.dota { border-color: rgba(255, 0, 127, 0.3); box-shadow: inset 0 0 40px rgba(255, 0, 127, 0.05); }
  .category-icon { font-size: 60px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)); }
  .category.tg .category-icon { color: var(--accent-3); }
  .category.dota .category-icon { color: var(--accent-2); }
  .category-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 18px; line-height: 1.2; }
  .category-sub { font-size: 11px; color: var(--text-dim); font-weight: 700; }

  .shop-item { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; margin: 12px 0; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s; }
  .shop-item:active { transform: scale(0.97); background: var(--glass-hover); border-color: rgba(255,255,255,0.2); }
  .shop-flag { width: 60px; height: 60px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); font-size: 34px; overflow: hidden; }
  .shop-flag img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
  .shop-info { flex: 1; }
  .shop-name { font-weight: 800; font-size: 17px; margin-bottom: 4px; }
  .shop-code { font-size: 12px; color: var(--text-dim); font-weight: 600; }
  .shop-price { font-size: 17px; color: var(--gold); font-weight: 900; white-space: nowrap; text-shadow: 0 0 10px rgba(254, 228, 64, 0.4); }

  .shop-item.vip { background: linear-gradient(135deg, rgba(254, 228, 64, 0.1), rgba(255, 0, 127, 0.1)); border: 1.5px solid rgba(254, 228, 64, 0.5); padding: 22px 16px; box-shadow: 0 0 30px rgba(254, 228, 64, 0.2); position: relative; overflow: hidden; }
  .shop-item.vip::after { content: "👑"; position: absolute; top: 8px; right: 12px; font-size: 18px; opacity: 0.8; }
  .shop-item.vip .shop-flag { background: linear-gradient(135deg, rgba(254, 228, 64, 0.2), rgba(255, 0, 127, 0.2)); border: 1px solid rgba(254, 228, 64, 0.4); font-size: 36px; }
  .shop-item.vip .shop-name { background: linear-gradient(135deg, var(--gold), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 19px; }
  .shop-item.vip .shop-code { color: var(--gold); font-weight: 700; }
  .shop-item.vip .shop-price { background: linear-gradient(135deg, var(--gold), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; font-weight: 900; text-shadow: none; }

  .dota-card { display: flex; flex-direction: column; padding: 26px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; margin: 12px 0; text-align: center; backdrop-filter: blur(10px); }
  .dota-icon { font-size: 56px; margin-bottom: 16px; filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.5)); }
  .dota-title { font-weight: 900; font-size: 20px; margin-bottom: 8px; }
