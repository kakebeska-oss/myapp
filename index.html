<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Byrat Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #05050f;
    --accent: #8b5cf6;
    --accent-hot: #d946ef;
    --accent-cyan: #22d3ee;
    --gold: #fbbf24;
    --green: #10b981;
    --red: #ef4444;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.55);
  }

  html, body { width: 100%; overflow-x: hidden; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    position: relative;
  }

  /* === ЯРКИЙ АНИМИРОВАННЫЙ ФОН === */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background: 
      radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.5), transparent 35%),
      radial-gradient(circle at 80% 30%, rgba(217, 70, 239, 0.4), transparent 35%),
      radial-gradient(circle at 50% 80%, rgba(34, 211, 238, 0.35), transparent 40%),
      radial-gradient(circle at 10% 90%, rgba(251, 191, 36, 0.25), transparent 35%);
    animation: bgRotate 25s linear infinite;
    pointer-events: none;
    z-index: 0;
    filter: blur(40px);
  }
  @keyframes bgRotate {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* Сетка */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(139, 92, 246, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139, 92, 246, 0.07) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
  }

  /* Летающие значки */
  .particle {
    position: fixed;
    font-weight: 900;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 10px currentColor);
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.9; }
    100% { transform: translateY(-115vh) translateX(40px) rotate(540deg); opacity: 0; }
  }

  /* Экраны */
  .screen {
    display: none;
    padding: 24px 20px 110px;
    min-height: 100vh;
    position: relative;
    z-index: 2;
    flex-direction: column;
  }
  .screen.active {
    display: flex;
    animation: screenIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(30px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Заголовки */
  .header { text-align: center; margin-bottom: 28px; margin-top: 12px; }
  .header h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 36px;
    letter-spacing: -1px;
    line-height: 1;
    background: linear-gradient(135deg, #ffffff 0%, #d946ef 40%, #8b5cf6 70%, #22d3ee 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
    filter: drop-shadow(0 0 30px rgba(217, 70, 239, 0.5));
    margin-bottom: 8px;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .header p {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* === КНОПКИ === */
  .btn {
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 16px 20px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin: 7px 0;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(217, 70, 239, 0.1));
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .btn:hover::after { opacity: 1; }
  .btn:active { transform: scale(0.96); }

  .btn-icon {
    font-size: 22px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(217, 70, 239, 0.2));
    border: 1px solid rgba(139, 92, 246, 0.4);
    border-radius: 14px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
  }
  .btn-text { display: flex; flex-direction: column; gap: 2px; position: relative; z-index: 1; }
  .btn-title { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
  .btn-sub { font-size: 11px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.5px; }

  /* === HERO КНОПКА === */
  .btn-hero {
    background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 50%, #8b5cf6 100%);
    background-size: 200% 200%;
    border: none;
    box-shadow: 
      0 25px 60px rgba(139, 92, 246, 0.6),
      0 0 80px rgba(217, 70, 239, 0.4),
      0 0 0 1px rgba(255,255,255,0.15) inset;
    justify-content: center;
    text-align: center;
    font-size: 22px;
    padding: 28px;
    margin: 50px 0;
    animation: heroGlow 3s ease-in-out infinite, gradientShift 4s ease infinite;
    position: relative;
    overflow: hidden;
  }
  .btn-hero::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.4), transparent 30%);
    animation: spin 4s linear infinite;
    pointer-events: none;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes heroGlow {
    0%, 100% { box-shadow: 0 25px 60px rgba(139, 92, 246, 0.6), 0 0 80px rgba(217, 70, 239, 0.4), 0 0 0 1px rgba(255,255,255,0.15) inset; }
    50% { box-shadow: 0 25px 80px rgba(139, 92, 246, 0.9), 0 0 120px rgba(217, 70, 239, 0.7), 0 0 0 1px rgba(255,255,255,0.25) inset; }
  }
  .btn-hero .btn-text { align-items: center; }
  .btn-hero .btn-title { font-size: 22px; letter-spacing: 2px; }

  /* === БАЛАНС === */
  .balance-card {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.18), rgba(251, 191, 36, 0.03));
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 28px;
    padding: 40px 24px;
    text-align: center;
    margin: 24px 0;
    backdrop-filter: blur(24px);
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(251, 191, 36, 0.25), 0 0 0 1px rgba(255,255,255,0.05) inset;
  }
  .balance-card::before {
    content: "";
    position: absolute;
    top: -100%; left: -100%;
    width: 300%; height: 300%;
    background: conic-gradient(from 0deg, transparent, rgba(251, 191, 36, 0.3), transparent 25%);
    animation: spin 6s linear infinite;
  }
  .balance-label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 16px;
    font-weight: 700;
    position: relative;
  }
  .balance-num {
    font-family: 'Montserrat', sans-serif;
    font-size: 72px;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 0%, #fbbf24 50%, #fff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s ease infinite;
    line-height: 1;
    position: relative;
    filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.9));
  }
  .balance-star { font-size: 24px; margin-left: 6px; }

  /* === МАГАЗИН === */
  .item {
    background: var(--glass);
    backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 16px;
    margin: 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    animation: itemIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    position: relative;
    overflow: hidden;
  }
  .item::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(139, 92, 246, 0.1));
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .item:hover::before { opacity: 1; }
  .item:hover { border-color: rgba(139, 92, 246, 0.5); transform: translateY(-3px); box-shadow: 0 15px 40px rgba(139, 92, 246, 0.3); }
  .item:nth-child(2) { animation-delay: 0.06s; }
  .item:nth-child(3) { animation-delay: 0.12s; }
  .item:nth-child(4) { animation-delay: 0.18s; }
  @keyframes itemIn {
    from { opacity: 0; transform: translateX(-30px) scale(0.95); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  .item-flag {
    font-size: 34px;
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .item-info { flex: 1; padding: 0 14px; position: relative; z-index: 1; }
  .item-name { font-weight: 800; font-size: 17px; margin-bottom: 4px; letter-spacing: -0.3px; }
  .item-price {
    font-size: 14px;
    color: var(--gold);
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
    text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
  }
  .btn-buy {
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 800;
    border-radius: 14px;
    color: #fff;
    box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
    width: auto;
    margin: 0;
    justify-content: center;
    position: relative;
    z-index: 1;
    letter-spacing: 0.5px;
  }
  .btn-buy:active { transform: scale(0.94); }

  /* === ПОПОЛНЕНИЕ === */
  .topup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin: 24px 0;
  }
  .topup-btn {
    background: var(--glass);
    backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 26px 12px;
    border-radius: 22px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: itemIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    position: relative;
    overflow: hidden;
  }
  .topup-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(217, 70, 239, 0.15));
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .topup-btn:hover::before { opacity: 1; }
  .topup-btn:hover { border-color: rgba(139, 92, 246, 0.6); transform: translateY(-4px); box-shadow: 0 20px 50px rgba(139, 92, 246, 0.4); }
  .topup-btn:active { transform: scale(0.95); }
  .topup-btn:nth-child(1) { animation-delay: 0.02s; }
  .topup-btn:nth-child(2) { animation-delay: 0.06s; }
  .topup-btn:nth-child(3) { animation-delay: 0.10s; }
  .topup-btn:nth-child(4) { animation-delay: 0.14s; }
  .topup-btn:nth-child(5) { animation-delay: 0.18s; }
  .topup-btn:nth-child(6) { animation-delay: 0.22s; }
  .topup-amount {
    font-size: 28px;
    font-weight: 900;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #fff, #d946ef);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
    z-index: 1;
  }
  .topup-star { font-size: 16px; position: relative; z-index: 1; }

  /* === ПРОМОКОД === */
  .promo-input {
    width: 100%;
    padding: 22px;
    font-size: 20px;
    font-weight: 800;
    font-family: 'Montserrat', sans-serif;
    border-radius: 20px;
    border: 2px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: blur(24px);
    color: white;
    text-align: center;
    outline: none;
    margin: 24px 0;
    text-transform: uppercase;
    letter-spacing: 6px;
    transition: all 0.3s;
  }
  .promo-input:focus {
    border-color: var(--accent-hot);
    box-shadow: 0 0 0 6px rgba(217, 70, 239, 0.2), 0 0 40px rgba(217, 70, 239, 0.4);
  }
  .promo-input::placeholder { color: rgba(255,255,255,0.25); letter-spacing: 4px; }

  /* === ПОМОЩЬ === */
  .help-card {
    background: var(--glass);
    backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    margin: 20px 0;
    position: relative;
    overflow: hidden;
    animation: itemIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .help-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), transparent, rgba(34, 211, 238, 0.15));
    pointer-events: none;
  }
  .help-link {
    display: inline-block;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    text-decoration: none;
    padding: 16px 32px;
    background: linear-gradient(135deg, #22d3ee, #0891b2);
    border-radius: 16px;
    margin-top: 16px;
    transition: all 0.3s;
    box-shadow: 0 10px 30px rgba(34, 211, 238, 0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
    position: relative;
    z-index: 1;
  }
  .help-link:active { transform: scale(0.95); }

  /* === НИЖНЯЯ НАВИГАЦИЯ === */
  .nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 10, 25, 0.85);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    padding: 10px;
    display: flex;
    gap: 4px;
    z-index: 100;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(139, 92, 246, 0.2);
    max-width: calc(100% - 32px);
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 62px;
    letter-spacing: 0.3px;
  }
  .nav-btn .nav-icon { font-size: 22px; transition: transform 0.3s; }
  .nav-btn.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(217, 70, 239, 0.3));
    box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
  }
  .nav-btn.active .nav-icon { transform: scale(1.15); }
  .nav-btn:active { transform: scale(0.92); }

  /* === ТОСТ === */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-160px);
    background: rgba(10, 10, 25, 0.95);
    backdrop-filter: blur(24px);
    border: 2px solid var(--glass-border);
    padding: 18px 28px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 15px;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    z-index: 1000;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    white-space: pre-line;
    box-shadow: 0 25px 80px rgba(0,0,0,0.7);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success {
    border-color: rgba(16, 185, 129, 0.8);
    box-shadow: 0 25px 80px rgba(16, 185, 129, 0.5), 0 0 60px rgba(16, 185, 129, 0.4);
  }
  .toast.error {
    border-color: rgba(239, 68, 68, 0.8);
    box-shadow: 0 25px 80px rgba(239, 68, 68, 0.5), 0 0 60px rgba(239, 68, 68, 0.4);
  }

  /* Утилиты */
  .glow-text {
    text-shadow: 0 0 20px currentColor;
  }
</style>
</head>
<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="screen-main" class="screen active">
  <div class="header">
    <h1>Byrat Shop</h1>
    <p>✦ Premium Accounts ✦</p>
  </div>
  <button class="btn btn-hero" onclick="showScreen('screen-menu')">
    <div class="btn-text">
      <span class="btn-title">НАЧАТЬ</span>
      <span class="btn-sub" style="color: rgba(255,255,255,0.9); font-size: 12px; letter-spacing: 2px;">ОТКРЫТЬ МАГАЗИН</span>
    </div>
  </button>
</div>

<!-- МЕНЮ -->
<div id="screen-menu" class="screen">
  <div class="header">
    <h1>Меню</h1>
    <p>Выбери действие</p>
  </div>

  <button class="btn" onclick="showScreen('screen-shop')">
    <div class="btn-icon">🛒</div>
    <div class="btn-text">
      <span class="btn-title">Магазин</span>
      <span class="btn-sub">Купить аккаунт</span>
    </div>
  </button>

  <button class="btn" onclick="showScreen('screen-topup')">
    <div class="btn-icon">➕</div>
    <div class="btn-text">
      <span class="btn-title">Пополнить</span>
      <span class="btn-sub">Звёзды или промокод</span>
    </div>
  </button>

  <button class="btn" onclick="showScreen('screen-balance')">
    <div class="btn-icon">💰</div>
    <div class="btn-text">
      <span class="btn-title">Баланс</span>
      <span class="btn-sub">Проверить счёт</span>
    </div>
  </button>

  <button class="btn" onclick="showScreen('screen-promo')">
    <div class="btn-icon">🎁</div>
    <div class="btn-text">
      <span class="btn-title">Промокод</span>
      <span class="btn-sub">Активировать код</span>
    </div>
  </button>

  <button class="btn" onclick="showScreen('screen-help')">
    <div class="btn-icon">❓</div>
    <div class="btn-text">
      <span class="btn-title">Помощь</span>
      <span class="btn-sub">Связаться с нами</span>
    </div>
  </button>
</div>

<!-- БАЛАНС -->
<div id="screen-balance" class="screen">
  <div class="header">
    <h1>Баланс</h1>
    <p>Твой счёт</p>
  </div>

  <div class="balance-card">
    <div class="balance-label">Доступно</div>
    <div class="balance-num" id="balance-display">0<span class="balance-star">⭐</span></div>
  </div>

  <button class="btn" onclick="showScreen('screen-topup')" style="justify-content: center; background: linear-gradient(135deg, rgba(139,92,246,0.4), rgba(217,70,239,0.3)); border-color: rgba(139,92,246,0.6);">
    <div class="btn-text" style="align-items: center;">
      <span class="btn-title">➕ Пополнить баланс</span>
    </div>
  </button>
</div>

<!-- ПОПОЛНЕНИЕ -->
<div id="screen-topup" class="screen">
  <div class="header">
    <h1>Пополнение</h1>
    <p>Выбери сумму</p>
  </div>

  <div class="topup-grid">
    <button class="topup-btn" onclick="payStars(10)">
      <span class="topup-amount">10</span>
      <span class="topup-star">⭐</span>
    </button>
    <button class="topup-btn" onclick="payStars(20)">
      <span class="topup-amount">20</span>

    <span>Магазин</span>
  </button>
  <button class="nav-btn" data-screen="screen-balance" onclick="showScreen('screen-balance'); loadBalance();">
    <span class="nav-icon">💰</span>
    <span>Баланс</span>
  </button>
  <button class="nav-btn" data-screen="screen-help" onclick="showScreen('screen-help')">
    <span class="nav-icon">❓</span>
    <span>Помощь</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  Telegram.WebApp.setHeaderColor('#05050f');
  Telegram.WebApp.setBackgroundColor('#05050f');

  const API_BASE = "https://my-telegram-bot.kakebeska.workers.dev";
  const urlParams = new URLSearchParams(window.location.search);
  const userId = urlParams.get('user_id')
    || (Telegram.WebApp.initDataUnsafe.user ? Telegram.WebApp.initDataUnsafe.user.id : null);

  // Летающие значки с разными цветами
  const symbols = [
    { char: "$", color: "#10b981" },
    { char: "⭐", color: "#fbbf24" },
    { char: "💎", color: "#22d3ee" },
    { char: "$", color: "#10b981" },
    { char: "✦", color: "#d946ef" },
    { char: "⭐", color: "#fbbf24" }
  ];
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    const s = symbols[Math.floor(Math.random() * symbols.length)];
    p.className = 'particle';
    p.textContent = s.char;
    p.style.color = s.color;
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + 'vh';
    p.style.fontSize = (12 + Math.random() * 18) + 'px';
    const dur = 10 + Math.random() * 14;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = '-' + (Math.random() * dur) + 's';
    p.style.opacity = 0.4 + Math.random() * 0.5;
    document.body.appendChild(p);
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.screen === id);
    });

    const nav = document.getElementById('nav');
    nav.style.display = (id === 'screen-main') ? 'none' : 'flex';

    if (id === 'screen-balance') loadBalance();
  }

  function showToast(text, type = '') {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast ' + type, 3500);
  }

  async function loadBalance() {
    const display = document.getElementById('balance-display');
    display.innerHTML = '...<span class="balance-star">⭐</span>';
    try {
      const res = await fetch(`${API_BASE}/api/balance?user_id=${userId}`);
      const data = await res.json();
      display.innerHTML = `${data.balance}<span class="balance-star">⭐</span>`;
    } catch (e) {
      display.innerHTML = '0<span class="balance-star">⭐</span>';
    }
  }

  async function activatePromo() {
    const input = document.getElementById('promo-input');
    const code = input.value.trim();
    if (!code) {
      showToast('Введи промокод', 'error');
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/promo?user_id=${userId}&code=${encodeURIComponent(code)}`);
      const data = await res.json();
      showToast(data.message, data.ok ? 'success' : 'error');
      if (data.ok) input.value = '';
    } catch (e) {
      showToast('Ошибка соединения', 'error');
    }
  }

  async function payStars(amount) {
    Telegram.WebApp.sendData("pay_" + amount);
    Telegram.WebApp.close();
  }

  async function buy(country) {
    try {
      const res = await fetch(`${API_BASE}/api/buy?user_id=${userId}&country=${country}`);
      const data = await res.json();
      if (data.ok) {
        showToast('Загляни в чат с ботом 👀', 'success');
      } else {
        showToast(data.message, 'error');
      }
    } catch (e) {
      showToast('Ошибка соединения', 'error');
    }
  }

  showScreen('screen-main');
</script>
</body>
</html>
