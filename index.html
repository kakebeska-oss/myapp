<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byrat Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #1a0033, #0f0c29);
    background-size: 500% 500%;
    animation: gradientBG 18s ease infinite;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Мягкое свечение поверх фона */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 30%, rgba(120,80,255,0.25), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(255,80,180,0.2), transparent 45%);
    animation: glowShift 12s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes glowShift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(20px, -20px) scale(1.15); }
  }

  /* Летающие значки */
  .particle {
    position: fixed;
    font-size: 20px;
    font-weight: 900;
    color: rgba(255,215,0,0.75);
    text-shadow: 0 0 12px rgba(255,215,0,0.6);
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg) scale(0.8);
      opacity: 0;
    }
    10% { opacity: 1; }
    50% {
      transform: translateY(-50vh) translateX(20px) rotate(180deg) scale(1.1);
      opacity: 1;
    }
    90% { opacity: 0.8; }
    100% {
      transform: translateY(-100vh) translateX(-20px) rotate(360deg) scale(0.9);
      opacity: 0;
    }
  }

  .screen {
    padding: 30px 22px;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .screen.active {
    display: flex;
    animation: screenIn 0.45s ease;
  }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 {
    font-weight: 900;
    font-size: 30px;
    text-align: center;
    margin-bottom: 22px;
    text-shadow: 0 0 22px rgba(140,140,255,0.85);
    animation: fadeDown 0.5s ease;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 18px 26px;
    font-size: 19px;
    font-weight: 700;
    border-radius: 18px;
    margin: 9px 0;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(102,126,234,0.5);
    transition: transform 0.15s, box-shadow 0.2s;
    animation: btnIn 0.45s ease backwards;
  }
  .btn:active { transform: scale(0.96); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
  @keyframes btnIn {
    from { opacity: 0; transform: translateY(18px) scale(0.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .btn-center {
    padding: 24px 70px;
    font-size: 26px;
    margin-top: 40px;
    animation: btnIn 0.6s ease backwards, pulseBtn 2.5s ease-in-out infinite 1s;
  }
  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 8px 25px rgba(102,126,234,0.5); }
    50% { box-shadow: 0 8px 40px rgba(140,120,255,0.9); }
  }
  .btn-exit {
    position: fixed;
    bottom: 20px; left: 20px;
    background: rgba(255,60,60,0.85);
    padding: 13px 22px;
    font-size: 16px;
    box-shadow: 0 6px 20px rgba(255,60,60,0.5);
    z-index: 3;
  }
  .btn-back {
    background: rgba(255,255,255,0.15);
    margin-top: 20px;
    font-size: 16px;
  }
  .menu { margin-top: 20px; display: flex; flex-direction: column; }
  .menu .btn:nth-child(1) { animation-delay: 0.05s; }
  .menu .btn:nth-child(2) { animation-delay: 0.13s; }
  .menu .btn:nth-child(3) { animation-delay: 0.21s; }
  .menu .btn:nth-child(4) { animation-delay: 0.29s; }
  .balance-box {
    background: rgba(255,255,255,0.1);
    padding: 28px;
    border-radius: 22px;
    text-align: center;
    margin: 20px 0;
    border: 1px solid rgba(255,255,255,0.2);
    animation: btnIn 0.5s ease;
  }
  .balance-num {
    font-size: 52px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 0 28px rgba(255,215,0,0.85);
  }
  .item {
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 18px;
    margin: 11px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid rgba(255,255,255,0.15);
    animation: btnIn 0.45s ease backwards;
  }
  .item:nth-child(2) { animation-delay: 0.05s; }
  .item:nth-child(3) { animation-delay: 0.13s; }
  .item:nth-child(4) { animation-delay: 0.21s; }
  .item-left { display: flex; align-items: center; gap: 13px; font-weight: 700; font-size: 17px; }
  .flag { font-size: 30px; }
  .price { color: #ffd700; font-size: 15px; font-weight: 700; }
  .btn-buy {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    padding: 11px 20px;
    font-size: 15px;
    border-radius: 13px;
    box-shadow: 0 6px 18px rgba(56,239,125,0.4);
    animation: none;
  }
  .checkmark {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 130px; height: 130px;
    border-radius: 50%;
    background: rgba(56,239,125,0.2);
    border: 4px solid #38ef7d;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    animation: pop 0.5s forwards;
    z-index: 999;
  }
  @keyframes pop {
    to { transform: translate(-50%, -50%) scale(1); }
  }
  .toast {
    position: fixed;
    top: 30px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(0,0,0,0.85);
    padding: 16px 26px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 17px;
    transition: transform 0.3s;
    z-index: 1000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  a { color: #7ec8ff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<!-- Летающие значки $ и ⭐ (генерируются скриптом) -->

<!-- ЭКРАН 1: ГЛАВНЫЙ -->
<div id="screen-main" class="screen active">
  <h1>Byrat Shop</h1>
  <button class="btn btn-center" onclick="showScreen('screen-menu')">СТАРТ</button>
  <button class="btn btn-exit" onclick="Telegram.WebApp.close()">← Выйти</button>
</div>

<!-- ЭКРАН 2: МЕНЮ -->
<div id="screen-menu" class="screen">
  <h1>Меню</h1>
  <div class="menu">
    <button class="btn" onclick="showScreen('screen-balance')">💰 Баланс</button>
    <button class="btn" onclick="showScreen('screen-shop')">🛒 Купить</button>
    <button class="btn" onclick="showScreen('screen-help')">❓ Помощь</button>
    <button class="btn btn-back" onclick="showScreen('screen-main')">← Назад</button>
  </div>
</div>

<!-- ЭКРАН 3: БАЛАНС -->
<div id="screen-balance" class="screen">
  <h1>💰 Баланс</h1>
  <div class="balance-box">
    <div class="balance-num" id="balance-display">0</div>
    <div>⭐ Звёзд</div>
  </div>
  <button class="btn" onclick="topUp()">➕ Пополнить</button>
  <button class="btn btn-back" onclick="showScreen('screen-menu')">← Назад</button>
</div>

<!-- ЭКРАН 4: МАГАЗИН -->
<div id="screen-shop" class="screen">
  <h1>🛒 Доступные аккаунты:</h1>

  <div class="item">
    <div class="item-left">
      <span class="flag">🇺🇸</span>
      <div>США +1<br><span class="price">100 ⭐</span></div>
    </div>
    <button class="btn btn-buy" onclick="buy(100)">Купить</button>
  </div>

  <div class="item">
    <div class="item-left">
      <span class="flag">🇨🇦</span>
      <div>Канада +1<br><span class="price">100 ⭐</span></div>
    </div>
    <button class="btn btn-buy" onclick="buy(100)">Купить</button>
  </div>

  <div class="item">
    <div class="item-left">
      <span class="flag">🇲🇲</span>
      <div>Мьянма +95<br><span class="price">120 ⭐</span></div>
    </div>
    <button class="btn btn-buy" onclick="buy(120)">Купить</button>
  </div>

  <button class="btn btn-back" onclick="showScreen('screen-menu')">← Назад</button>
</div>

<!-- ЭКРАН 5: ПОМОЩЬ -->
<div id="screen-help" class="screen">
  <h1>❓ Помощь</h1>
  <p style="text-align:center; margin: 20px 0; font-size: 17px;">
    По всем вопросам пишите в техподдержку:
  </p>
  <p style="text-align:center; font-size: 21px;">
    <a href="https://t.me/ownerByrat_Shop" target="_blank">@ownerByrat_Shop</a>
  </p>
  <button class="btn btn-back" onclick="showScreen('screen-menu')">← Назад</button>
</div>

<div class="checkmark" id="checkmark">✓</div>
<div class="toast" id="toast"></div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  /* ГЕНЕРАЦИЯ ЛЕТАЮЩИХ ЗНАЧКОВ */
  const symbols = ["$", "⭐", "$", "⭐", "$", "$", "⭐"];
  const PARTICLE_COUNT = 28;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];

    // Позиция по горизонтали
    p.style.left = Math.random() * 100 + '%';

    // Стартовая позиция по вертикали — от низа и выше,
    // чтобы часть значков уже была в кадре при открытии
    const startY = Math.random() * 100; // 0–100 vh
    p.style.top = startY + 'vh';

    // Размер
    const size = 14 + Math.random() * 18;
    p.style.fontSize = size + 'px';

    // Скорость (плавнее и медленнее — 8–18 секунд)
    const duration = 8 + Math.random() * 10;
    p.style.animationDuration = duration + 's';

    // Отрицательная задержка — анимация уже "в процессе" при старте
    p.style.animationDelay = '-' + (Math.random() * duration) + 's';

    // Прозрачность чуть разная
    p.style.opacity = 0.5 + Math.random() * 0.5;

    document.body.appendChild(p);
  }

  /* ЛОГИКА ЭКРАНОВ */
  let balance = parseInt(localStorage.getItem('balance') || '0');

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'screen-balance') updateBalance();
  }

  function updateBalance() {
    document.getElementById('balance-display').textContent = balance;
  }

  function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function topUp() {
    showToast('Оплата звёздами скоро появится');
  }

  function buy(price) {
    if (balance >= price) {
      balance -= price;
      localStorage.setItem('balance', balance);
      updateBalance();

      const check = document.getElementById('checkmark');
      check.style.display = 'flex';
      setTimeout(() => {
        check.style.display = 'none';
        showToast('Транзакция произведена успешно!');
      }, 1200);
    } else {
      showToast('Недостаточно звёзд на балансе');
    }
  }

  updateBalance();
</script>
</body>
</html>
