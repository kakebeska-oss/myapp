      <div class="big-icon">💤</div>
      <div class="badge inactive">🔴 Не активна</div>
      <p style="color:var(--text-dim);margin-top:12px;">Загрузка...</p>
    </div>
  </div>

  <!-- ЭКРАН: ПОПОЛНЕНИЕ -->
  <div id="screenTopup" class="screen">
    <div class="back-btn" onclick="showScreen('screenMain')">← Назад</div>
    <h2 style="font-size:22px;font-weight:800;margin-bottom:4px;">💰 Пополнение</h2>
    <p style="color:var(--text-dim);font-size:14px;margin-bottom:16px;">Купи звёзды Telegram для пополнения баланса</p>
    <div class="topup-grid">
      <div class="topup-btn" onclick="topup(10)">10 <span class="stars">⭐️</span></div>
      <div class="topup-btn" onclick="topup(25)">25 <span class="stars">⭐️</span></div>
      <div class="topup-btn" onclick="topup(50)">50 <span class="stars">⭐️</span></div>
      <div class="topup-btn" onclick="topup(100)">100 <span class="stars">⭐️</span></div>
      <div class="topup-btn" onclick="topup(250)">250 <span class="stars">⭐️</span></div>
      <div class="topup-btn" onclick="topup(500)">500 <span class="stars">⭐️</span></div>
    </div>
    <p style="font-size:12px;color:var(--text-dim);text-align:center;margin-top:12px;">1 ⭐️ = 1 балл баланса</p>
  </div>

  <!-- ЭКРАН: ПРОМОКОД -->
  <div id="screenPromo" class="screen">
    <div class="back-btn" onclick="showScreen('screenMain')">← Назад</div>
    <h2 style="font-size:22px;font-weight:800;margin-bottom:4px;">🎁 Промокод</h2>
    <p style="color:var(--text-dim);font-size:14px;margin-bottom:16px;">Введи промокод и получи бонус</p>
    <div style="display:flex;gap:10px;">
      <input id="promoInput" type="text" placeholder="ВВЕДИ ПРОМОКОД" style="flex:1;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:14px;color:var(--text);font-size:16px;font-weight:700;text-transform:uppercase;font-family:'Inter',sans-serif;outline:none;">
      <button class="btn-primary" style="flex:0 0 auto;padding:14px 20px;width:auto;" onclick="activatePromo()">Активировать</button>
    </div>
    <div id="promoResult" style="margin-top:16px;font-size:14px;text-align:center;"></div>
  </div>

</div>

<!-- МОДАЛКА ПОДТВЕРЖДЕНИЯ ПОКУПКИ РАТКИ -->
<div id="ratkaModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modalTitle">🔥 Подтверждение</h3>
    <p id="modalText">Загрузка...</p>
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <button id="methodStars" class="btn-secondary" style="flex:1;border-color:var(--gold);" onclick="selectMethod('stars')">⭐ Звёзды</button>
      <button id="methodBalance" class="btn-secondary" style="flex:1;" onclick="selectMethod('balance')">💰 Баланс</button>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('ratkaModal')">Отмена</button>
      <button class="btn-primary" id="modalConfirmBtn" onclick="confirmRatkaPurchase()">Купить</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА РЕЗУЛЬТАТА -->
<div id="resultModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="resultTitle">✅ Готово</h3>
    <p id="resultText" style="margin-bottom:20px;">Операция выполнена</p>
    <div class="modal-actions">
      <button class="btn-primary" onclick="closeModal('resultModal')">Ок</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ПОЛЬЗОВАТЕЛЬ
// ============================================================
const tg = window.Telegram?.WebApp;
const USER_ID = tg?.initDataUnsafe?.user?.id ||
                new URLSearchParams(window.location.search).get("user_id") ||
                "test_user_123";

let configs = [];
let selectedType = null;
let selectedMethod = "stars";

// ============================================================
// НАВИГАЦИЯ
// ============================================================
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "screenAccounts") loadAccounts();
  if (id === "screenRatka") loadRatkaConfig();
  if (id === "screenRatkaStatus") loadRatkaStatus();
}

// ============================================================
// БАЛАНС
// ============================================================
async function loadBalance() {
  try {
    const res = await fetch("/api/balance?user_id=" + USER_ID);
    const json = await res.json();
    document.getElementById("userBalance").textContent = json.balance || 0;
  } catch(e) {}
}

// ============================================================
// АККАУНТЫ
// ============================================================
const COUNTRIES = [
  { name: "Россия", flag: "🇷🇺", id: "Russia", price: 50 },
  { name: "Украина", flag: "🇺🇦", id: "Ukraine", price: 40 },
  { name: "США", flag: "🇺🇸", id: "USA", price: 100 },
  { name: "Германия", flag: "🇩🇪", id: "Germany", price: 80 },
];

function loadAccounts() {
  const list = document.getElementById("accountsList");
  list.innerHTML = COUNTRIES.map(c => `
    <div class="item">
      <div class="flag">${c.flag}</div>
      <div class="item-info">
        <div class="item-name">${c.name}</div>
        <div class="item-price">⭐ ${c.price}</div>
      </div>
      <button class="btn-buy" onclick="buyAccount('${c.id}')">Купить</button>
    </div>
  `).join("");
}

async function buyAccount(country) {
  const res = await fetch("/api/buy?user_id=" + USER_ID + "&country=" + country);
  const json = await res.json();
  showResult(json.ok ? "✅ Успешно" : "❌ Ошибка", json.message || "Готово");
  loadBalance();
}

// ============================================================
// РАТКА — ЗАГРУЗКА КОНФИГА
// ============================================================
async function loadRatkaConfig() {
  document.getElementById("ratkaConfigLoading").style.display = "block";
  document.getElementById("ratkaGrid").innerHTML = "";
  try {
    const res = await fetch("/api/ratka_config");
    const json = await res.json();
    if (!json.ok) throw new Error("error");
    configs = json.configs;
    document.getElementById("ratkaConfigLoading").style.display = "none";
    renderRatkaCards();
  } catch(e) {
    document.getElementById("ratkaConfigLoading").innerHTML = '<p style="color:var(--red);">❌ Ошибка загрузки</p>';
  }
}

function renderRatkaCards() {
  const grid = document.getElementById("ratkaGrid");
  grid.innerHTML = configs.map(c => `
    <div class="ratka-card" onclick="openRatkaModal('${c.id}')">
      <h3>🔥 ${c.name}</h3>
      <div class="desc">${c.description}</div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px;">📅 ${c.duration_days} дней</div>
      <div class="price-row">
        <span class="price-stars">⭐ ${c.price_stars}</span>
        <span class="price-balance">💰 ${c.price_balance}₽</span>
      </div>
    </div>
  `).join("");
}

// ============================================================
// РАТКА — ПОКУПКА
// ============================================================
function openRatkaModal(type) {
  selectedType = type;
  const cfg = configs.find(c => c.id === type);
  if (!cfg) return;
  document.getElementById("modalTitle").textContent = "🔥 " + cfg.name;
  document.getElementById("modalText").innerHTML = `
    Тариф: <b>${cfg.name}</b><br>
    Длительность: <b>${cfg.duration_days} дней</b><br>
    Платформы: <b>${cfg.platforms.join(", ")}</b>
  `;
  updateMethodButtons();
  document.getElementById("ratkaModal").style.display = "flex";
}

function selectMethod(method) {
  selectedMethod = method;
  updateMethodButtons();
}

function updateMethodButtons() {
  const cfg = configs.find(c => c.id === selectedType);
  if (!cfg) return;
  document.getElementById("methodStars").textContent = "⭐ " + cfg.price_stars;
  document.getElementById("methodBalance").textContent = "💰 " + cfg.price_balance + "₽";
  document.getElementById("methodStars").style.borderColor = selectedMethod === "stars" ? "var(--gold)" : "var(--glass-border)";
  document.getElementById("methodBalance").style.borderColor = selectedMethod === "balance" ? "var(--gold)" : "var(--glass-border)";
}

async function confirmRatkaPurchase() {
  const btn = document.getElementById("modalConfirmBtn");
  btn.textContent = "⏳...";
  btn.disabled = true;
  try {
    const res = await fetch(\`/api/buy_ratka?user_id=\${USER_ID}&type=\${selectedType}&method=\${selectedMethod}\`);
    const json = await res.json();
    closeModal("ratkaModal");
    showResult(json.ok ? "✅ Успешно" : "❌ Ошибка", json.message || "Готово");
    loadBalance();
  } catch(e) {
    closeModal("ratkaModal");
    showResult("❌ Ошибка", "Сетевая ошибка");
  }
  btn.textContent = "Купить";
  btn.disabled = false;
}

// ============================================================
// РАТКА — СТАТУС
// ============================================================
async function loadRatkaStatus() {
  const container = document.getElementById("statusContent");
  try {
    const res = await fetch("/api/ratka_status?user_id=" + USER_ID);
    const json = await res.json();
    if (json.active) {
      container.innerHTML = \`
        <div class="big-icon">✅</div>
        <div class="badge active">🟢 Активна</div>
        <div style="margin-top:16px;text-align:left;background:var(--glass);border-radius:14px;padding:16px;">
          <p><b>Тип:</b> \${json.data.type}</p>
          <p><b>Осталось:</b> \${json.data.expiresInDays} дней</p>
          <p><b>Истекает:</b> \${new Date(json.data.expiresAt).toLocaleDateString()}</p>
          \${json.data.panelUrl ? \`<p><b>Панель:</b> <a href="\${json.data.panelUrl}" target="_blank" style="color:var(--accent-cyan);">открыть</a></p>\` : ""}
        </div>
      \`;
    } else {
      container.innerHTML = \`
        <div class="big-icon">💤</div>
        <div class="badge inactive">🔴 Не активна</div>
        <p style="color:var(--text-dim);margin-top:16px;">Купи ратку в разделе 🔥 Ратка</p>
      \`;
    }
  } catch(e) {
    container.innerHTML = \`<div class="big-icon">❌</div><p style="color:var(--red);">Ошибка загрузки</p>\`;
  }
}

// ============================================================
// ПОПОЛНЕНИЕ
// ============================================================
function topup(amount) {
  if (tg) {
    tg.openTelegramLink("https://t.me/" + tg.initDataUnsafe.user.username + "?start=topup_" + amount);
  } else {
    window.open("https://t.me/your_bot_username?start=topup_" + amount, "_blank");
  }
}

// ============================================================
// ПРОМОКОД
// ============================================================
async function activatePromo() {
  const code = document.getElementById("promoInput").value.trim();
  if (!code) return;
  const div = document.getElementById("promoResult");
  try {
    const res = await fetch("/api/promo?user_id=" + USER_ID + "&code=" + encodeURIComponent(code));
    const json = await res.json();
    div.innerHTML = json.ok
      ? '<span style="color:var(--green);font-weight:700;">✅ ' + json.message + '</span>'
      : '<span style="color:var(--red);font-weight:700;">❌ ' + json.message + '</span>';
    loadBalance();
  } catch(e) {
    div.innerHTML = '<span style="color:var(--red);font-weight:700;">❌ Ошибка</span>';
  }
}

// ============================================================
// МОДАЛКИ
// ============================================================
function closeModal(id) {
  document.getElementById(id).style.display = "none";
}

function showResult(title, text) {
  document.getElementById("resultTitle").textContent = title;
  document.getElementById("resultText").textContent = text;
  document.getElementById("resultModal").style.display = "flex";
}

// ============================================================
// СТАРТ
// ============================================================
tg?.ready();
tg?.expand();
loadBalance();
</script>
</body>
</html>\`;
}
